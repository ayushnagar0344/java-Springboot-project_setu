# ==========================================
#  NyaySetu Backend — Application Properties
# ==========================================

# --- Server ---
server.port=8080

# --- Logging ---
logging.file.name=logs/nyaysetu.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.nyaysetu=DEBUG

# --- MySQL Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/nyaysetu_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
app.jwt.secret=NyaySetuSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024!
app.jwt.expiration-ms=86400000
