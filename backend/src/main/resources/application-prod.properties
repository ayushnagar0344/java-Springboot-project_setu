# ==========================================
#  NyaySetu Backend — PRODUCTION (Render/Cloud) Profile
#  Uses H2 in-memory database — no external MySQL needed
# ==========================================

# --- Server ---
server.port=8080

# --- H2 In-Memory Database ---
spring.datasource.url=jdbc:h2:mem:nyaysetudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate (override ALL MySQL-specific settings from base profile) ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---
app.jwt.secret=NyaySetuSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024!
app.jwt.expiration-ms=86400000

# --- Logging ---
logging.level.root=WARN
logging.level.com.nyaysetu=INFO
logging.file.name=
